name: Olympiacos Ticket Checker

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # schedule disabled - cron-job.org triggers this via workflow_dispatch every 5 minutes
  # - cron: "*/5 * * * *"
  workflow_dispatch:          # triggered by cron-job.org + allows manual runs from Actions tab
    inputs:
      event_id:
        description: "Event ID to check (empty = Olympiacos - Milan)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: select seats but do NOT add them to the cart"
        type: boolean
        required: false
        default: false

# One check at a time; never cancel a run that may be adding seats to the cart
concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check-seats:
    name: Check gates under 300€ (Olympiacos - Milan)
    runs-on: ubuntu-latest
    timeout-minutes: 30       # room for the Queue-it waiting room during busy sales

    env:
      LOGIN_EMAIL:        ${{ secrets.LOGIN_EMAIL }}
      LOGIN_PASSWORD:     ${{ secrets.LOGIN_PASSWORD }}
      NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER:        ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
      EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_RECIPIENTS:   ${{ secrets.EMAIL_RECIPIENTS }}
      MAX_PRICE:          ${{ vars.MAX_PRICE }}
      TICKETS:            ${{ vars.TICKETS }}
      EVENT_ID:           ${{ inputs.event_id }}
      DRY_RUN:            ${{ inputs.dry_run && '1' || '0' }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 3. Quick price-list check (no browser) ───────────────────────────────
      - name: Pre-check price list
        id: precheck
        run: python check_tickets.py --precheck

      # ── 4. Browser only when a gate under the price limit exists ─────────────
      # Note: we do NOT cache the browser binary because Playwright auto-updates
      # and the cached binary becomes mismatched with the new package version.
      - name: Install Playwright Chromium
        if: steps.precheck.outputs.found == 'true'
        run: python -m playwright install chromium --with-deps

      - name: Log in, select seats and add to cart
        if: steps.precheck.outputs.found == 'true'
        run: python check_tickets.py

      # ── 5. Alert if 3+ consecutive failures ──────────────────────────────────
      - name: Alert on 3 consecutive failures
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          token  = os.environ['GH_TOKEN']
          repo   = os.environ['REPO']
          topic  = os.environ.get('NTFY_TOPIC', '')
          server = os.environ.get('NTFY_SERVER', 'https://ntfy.sh')

          url = (f"https://api.github.com/repos/{repo}/actions/workflows"
                 f"/check_tickets.yml/runs?per_page=10&status=completed")
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
          })
          runs = json.loads(urllib.request.urlopen(req).read()).get('workflow_runs', [])

          consecutive = 1   # current run (still in progress in the API)
          for r in runs:
              if r['conclusion'] == 'failure':
                  consecutive += 1
              else:
                  break
          print(f"Consecutive failures (including current run): {consecutive}")

          if consecutive >= 3 and topic:
              msg = (
                  f"The Olympiacos ticket checker has FAILED {consecutive} times in a row!\n\n"
                  f"It has been broken for ~{consecutive * 5} minutes.\n\n"
                  f"Fix it here:\nhttps://github.com/{repo}/actions"
              )
              payload = json.dumps({
                  'topic':    topic,
                  'title':    f'Olympiacos Checker DOWN - {consecutive} failures in a row!',
                  'message':  msg,
                  'priority': 5,
                  'tags':     ['warning', 'rotating_light', 'sos'],
              }).encode()
              urllib.request.urlopen(urllib.request.Request(
                  server, data=payload, method='POST',
                  headers={'Content-Type': 'application/json'}))
              print(f"ALERT sent! Topic: {topic}")
          EOF
